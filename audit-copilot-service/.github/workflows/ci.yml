# Standalone audit-copilot repository workflow after transfer.
name: Copilot offline safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: npm ci --prefix ui && npm run build --prefix ui
      - run: python -m audit_copilot.evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-fixture-evaluation-not-model-quality
          path: artifacts/evaluation.json
          retention-days: 7
