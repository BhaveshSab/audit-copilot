[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assetflow-audit-copilot"
version = "0.1.0"
description = "Evidence-grounded, human-reviewed audit investigations for AssetFlow"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "mcp>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
audit-eval = "audit_copilot.evaluate:main"
audit-mcp = "audit_copilot.mcp_server:main"

[tool.setuptools.packages.find]
include = ["audit_copilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"] # FastAPI dependency injection is an intentional default.
