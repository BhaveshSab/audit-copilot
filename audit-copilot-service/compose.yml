# Explicit opt-in local stack. Does not touch AssetFlow or its database/volumes.
services:
  copilot:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      COPILOT_MODE: ${COPILOT_MODE:-demo}
      ASSETFLOW_URL: ${ASSETFLOW_URL:-http://host.docker.internal:3000/api}
      COPILOT_DATABASE_URL: postgresql://copilot:${COPILOT_DB_PASSWORD:?set a dedicated database password}@policy-db:5432/copilot
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_FALLBACK: ${LLM_FALLBACK:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["copilot-state:/state"]
    depends_on:
      policy-db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  policy-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_DB: copilot
      POSTGRES_PASSWORD: ${COPILOT_DB_PASSWORD:?set a dedicated database password}
    volumes:
      - policy-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-policy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  copilot-state:
  policy-data:
